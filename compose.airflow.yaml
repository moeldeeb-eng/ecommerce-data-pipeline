# Additive overlay: use together with the existing compose.yaml.
x-airflow-common: &airflow-common
  image: ecommerce-airflow:3.2.2-python3.11
  build:
    context: ./airflow
    dockerfile: Dockerfile
  pull_policy: never
  user: "${AF_UID:?Run scripts/prepare_airflow.py first}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AF_METADATA_PASSWORD:?Run scripts/prepare_airflow.py first}@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AF_FERNET_KEY:?Run scripts/prepare_airflow.py first}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AF_JWT_SECRET:?Run scripts/prepare_airflow.py first}
    AIRFLOW__API_AUTH__JWT_ISSUER: ecommerce-local-airflow
    AIRFLOW__API__SECRET_KEY: ${AF_API_SECRET_KEY:?Run scripts/prepare_airflow.py first}
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/project/src
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:?Missing ecommerce POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER:?Missing ecommerce POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing ecommerce POSTGRES_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./src:/opt/project/src:ro
    - ./sql:/opt/project/sql:ro
    - ./data:/opt/project/data
  depends_on: &airflow-deps
    airflow-db:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AF_METADATA_PASSWORD:?Run scripts/prepare_airflow.py first}
    shm_size: "256mb"
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: [airflow, db, migrate]
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    hostname: airflow-api-server
    command: [airflow, api-server]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: [airflow, scheduler]
    depends_on:
      <<: *airflow-deps
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    hostname: airflow-dag-processor
    command: [airflow, dag-processor]
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$$HOSTNAME"']
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 40s
    restart: unless-stopped

volumes:
  airflow_metadata_data:
